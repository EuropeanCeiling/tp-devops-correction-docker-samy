services:
  database:
    build: "database"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    volumes:
      - db-volume:/var/lib/postgresql/data
    networks:
      - my-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: "simple-api"
    environment:
      - DATABASE_HOST=database
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    networks:
      - my-network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  httpd:
    build: "http-server"
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - my-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  my-network:

volumes:
  db-volume:
