name: CI devops 2025

"on":
  # Vérifier chaque commit envoyé sur les branches de travail du TP.
  push:
    branches: [main, develop]
  # Vérifier aussi les changements proposés avant leur fusion.
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Récupérer les sources avant de lancer Maven.
      - uses: actions/checkout@v4

      # L'application est compilée avec Java 21 ; le cache accélère les exécutions suivantes.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simple-api/pom.xml

      # verify exécute les tests unitaires et les tests d'intégration.
      - name: Build and test with Maven
        run: mvn -B clean verify --file ./simple-api/pom.xml

  build-and-push-docker-image:
    # Ne construire les images que lorsque les tests du backend ont réussi.
    needs: test-backend
    runs-on: ubuntu-24.04
    env:
      # Les pull requests provenant d'un fork n'ont pas accès aux secrets.
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Les identifiants Docker Hub ne servent que pour une publication depuis main.
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ env.IMAGE_NAMESPACE }}/tp-devops-simple-api:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ env.IMAGE_NAMESPACE }}/tp-devops-database:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ env.IMAGE_NAMESPACE }}/tp-devops-httpd:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
