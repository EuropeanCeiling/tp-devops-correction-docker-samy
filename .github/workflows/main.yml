name: CI devops 2025

permissions:
  contents: read

"on":
  # Vérifier chaque commit envoyé sur les branches de travail du TP.
  push:
    branches: [main, develop]
  # Vérifier aussi les changements proposés avant leur fusion.
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Récupérer les sources avant de lancer Maven.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # L'application est compilée avec Java 21 ; le cache accélère les exécutions suivantes.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simple-api/pom.xml

      # verify exécute les tests unitaires et les tests d'intégration.
      - name: Build and test with Maven
        run: mvn -B clean verify --file ./simple-api/pom.xml

      # Le statut de la Quality Gate fait échouer la CI et bloque la publication.
      - name: Analyze with SonarCloud
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: EuropeanCeiling_tp-devops-correction-docker-samy
          SONAR_ORGANIZATION: europeanceiling
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "Configure the SONAR_TOKEN secret in GitHub Actions." >&2
            exit 1
          fi
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            --file ./simple-api/pom.xml
