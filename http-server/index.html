<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10251f">
  <title>Étudiants | Campus</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f3f5f1; color: #17221e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { background: #10251f; color: #f5f3e9; padding: 1.25rem max(1.5rem, calc((100vw - 1080px) / 2)); display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 1.1rem; font-weight: 750; letter-spacing: .04em; }
    .brand span { color: #c5dc9b; }
    .api-link { color: #d7e7bd; text-decoration: none; font-size: .9rem; }
    main { max-width: 1080px; margin: 0 auto; padding: 4.5rem 1.5rem; }
    .eyebrow { color: #58764a; font-size: .78rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 650px; margin: .8rem 0; font-family: Georgia, serif; font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 500; letter-spacing: -.045em; line-height: 1.02; }
    .intro { max-width: 560px; color: #65716b; font-size: 1.05rem; line-height: 1.7; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin: 3.5rem 0 1rem; }
    h2 { margin: 0; font-size: 1.25rem; }
    #status { color: #65716b; font-size: .9rem; }
    #students { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
    .student { background: white; border: 1px solid #e3e8e0; border-radius: 12px; padding: 1.25rem; box-shadow: 0 8px 24px #17221e0a; }
    .student h3 { margin: 0 0 .5rem; font-size: 1.05rem; }
    .student p { margin: 0; color: #65716b; font-size: .9rem; }
    .empty { grid-column: 1 / -1; border: 1px dashed #cbd4c7; border-radius: 12px; padding: 1.5rem; color: #65716b; }
    footer { max-width: 1080px; margin: 0 auto; padding: 1rem 1.5rem 2rem; color: #87918b; font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">CAMPUS<span> / STUDENTS</span></div>
    <a class="api-link" href="/api/students">API étudiants ↗</a>
  </header>
  <main>
    <div class="eyebrow">Annuaire du campus</div>
    <h1>Les parcours commencent ici.</h1>
    <p class="intro">Retrouvez les étudiants inscrits et leur département. Ces informations sont chargées directement depuis l’API.</p>
    <section aria-labelledby="students-title">
      <div class="section-head">
        <h2 id="students-title">Étudiants</h2>
        <div id="status" role="status" aria-live="polite">Chargement…</div>
      </div>
      <div id="students"></div>
    </section>
  </main>
  <footer>Campus · Annuaire des étudiants</footer>
  <script>
    const list = document.querySelector('#students');
    const status = document.querySelector('#status');

    function makeCard(student) {
      const card = document.createElement('article');
      card.className = 'student';
      const name = document.createElement('h3');
      name.textContent = [student.firstname, student.lastname].filter(Boolean).join(' ') || `Étudiant ${student.id}`;
      const department = document.createElement('p');
      department.textContent = student.department?.name || 'Département non renseigné';
      card.append(name, department);
      return card;
    }

    async function loadStudents() {
      try {
        const response = await fetch('/api/students', { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`Réponse HTTP ${response.status}`);
        const students = await response.json();
        if (!Array.isArray(students)) throw new Error('Format de réponse inattendu');
        list.replaceChildren();
        if (students.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'Aucun étudiant à afficher pour le moment.';
          list.append(empty);
        } else {
          students.forEach(student => list.append(makeCard(student)));
        }
        status.textContent = `${students.length} étudiant${students.length > 1 ? 's' : ''}`;
      } catch (error) {
        status.textContent = 'API indisponible';
        const message = document.createElement('p');
        message.className = 'empty';
        message.textContent = 'Les étudiants ne peuvent pas être chargés. Réessayez plus tard.';
        list.replaceChildren(message);
        console.error('Échec du chargement des étudiants:', error);
      }
    }

    loadStudents();
  </script>
</body>
</html>
